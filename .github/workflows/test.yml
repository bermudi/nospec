name: test

on:
  push:
  pull_request:

jobs:
  runner:
    name: runner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Configure fixture commits
        run: |
          git config --global user.name "Nospec tests"
          git config --global user.email "nospec-tests@example.invalid"
      - name: Run regression suite
        run: ./tests/run.sh
